name: Editor Bridge (temporary)

on:
  push:
    branches: [ arena/79c9a834-teeworlds-mrpg-0-6 ]
    paths:
      - '.ci/**'
      - '.github/workflows/editor-bridge.yml'

concurrency:
  group: editor-bridge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/79c9a834-teeworlds-mrpg-0-6
      - name: Run task
        env:
          EDITOR_BASE: https://editor.mmotee.online
          GUEST_LOGIN: test
          GUEST_PASSWORD: '123123'
        run: |
          set -o pipefail
          mkdir -p .ci/out
          bash .ci/task.sh 2>&1 | tee .ci/out/result.txt
      - name: Publish result
        run: |
          git config user.name editor-bridge
          git config user.email editor-bridge@users.noreply.github.com
          git add -A .ci
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -q -m "ci(bridge): result"
          git pull --rebase --autostash origin arena/79c9a834-teeworlds-mrpg-0-6
          git push origin HEAD:arena/79c9a834-teeworlds-mrpg-0-6
