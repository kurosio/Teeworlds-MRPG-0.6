# Configuration of the synchronization relay (mmoteeworlds_relay).
#
# The relay is a plain retransmitter for the cross-server synchronization: every
# game server keeps one outgoing TCP connection to it, and a message produced on
# one server is forwarded to all the other connected servers. Nothing is stored
# on disk, so restarting the relay only costs the connections.
#
# The relay reads this file from its working directory (or use -f <file>).
# The same settings can also be given on the command line. Every argument is
# read as one config line, so a setting with a value needs quotes:
#   mmoteeworlds_relay "relay_port 8383" "relay_password secret"
#
# On Windows the relay hides its own console window right after the start, so
# the window that flashes during the start is expected and the relay keeps
# running in the background. Its messages go to the console and to `logfile`;
# set it below, because a hidden console cannot be read and the reason a server
# was refused is only visible there.

# Port the relay listens on. Must be reachable by every game server.
relay_port 8383

# Maximum number of game servers connected at the same time.
relay_max_clients 64

# Password the game servers send in the handshake. It must match
# sv_sync_relay_password of every server. Empty = no password, which is fine for
# a relay that is only reachable from the private network.
relay_password ""

# Name the relay reports to the connected servers, appears in the server log.
relay_name "mrpg-relay"

# Optional: bind only to one interface (default: all interfaces).
#bindaddr 127.0.0.1

# Where the log of the relay is written, next to the working directory of the
# relay or as an absolute path. Empty = console only, which is useless on a
# Windows relay with a hidden window: the log is the only place where a refused
# server, a wrong password or a dropped connection shows up.
#logfile "relay.log"

# Append to the log file instead of overwriting it on every start.
#logappend 1
