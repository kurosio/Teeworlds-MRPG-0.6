<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worlds • Editor Studio</title>
  <script src="editor-core/page-loader.js" data-mode="event"></script>
</head>

<body class="editor-theme" data-editor="worlds">
  <div class="editor-page">
    <div class="editor-page-header">
      <div class="editor-page-title">
        <i class="fa-solid fa-globe text-accent text-xl"></i>
        <div>
          <h1>Worlds</h1>
          <div class="editor-page-sub">World settings: type, paths, game flags and options.</div>
        </div>
      </div>
      <div class="editor-page-actions">
        <button class="editor-btn editor-btn-secondary" data-editor-role="refresh">
          <i class="fa-solid fa-rotate"></i><span>Refresh</span>
        </button>
        <button class="editor-btn editor-btn-primary" data-editor-role="new">
          <i class="fa-solid fa-plus"></i><span>New world</span>
        </button>
      </div>
    </div>

    <div class="editor-shell editor-shell--docked">
      <!-- Sidebar -->
      <aside class="editor-sidebar editor-dock-sidebar">
        <div class="editor-dock-pad">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold">World list</div>
              <div class="text-xs editor-muted-text">Total: <span data-editor-role="count">—</span></div>
            </div>
          </div>

          <div class="mt-3">
            <div class="editor-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input data-editor-role="search" type="search" class="w-full editor-input form-input" placeholder="Search by ID/name/path…" />
            </div>
          </div>

          <div class="mt-3 editor-sidebar-filters">
            <select id="filterType" class="w-full editor-input form-input">
              <option value="">All types</option>
            </select>
          </div>

          <div class="mt-4 editor-sidebar-list editor-scroll" data-editor-role="list"></div>
        </div>
      </aside>

      <!-- Main -->
      <section class="editor-main editor-dock-main">
        <div class="editor-dock-pad">
          <div class="editor-sticky-toolbar flex items-start justify-between gap-4">
            <div>
              <div class="text-lg font-semibold" data-editor-role="title">Select a world</div>
              <div class="editor-muted-text text-sm mt-1" data-editor-role="subtitle">or create a new one</div>
            </div>
            <div class="editor-page-actions">
              <span id="dirty-pill" class="editor-dirty-pill hidden">Data not saved</span>
              <button class="editor-btn editor-btn-primary" data-editor-role="save" disabled>
                <i class="fa-solid fa-floppy-disk"></i><span>Save</span>
              </button>
              <button class="editor-btn editor-btn-secondary hidden" data-editor-role="cancel" disabled>
                <i class="fa-solid fa-rotate-left"></i><span>Cancel</span>
              </button>
              <button class="editor-btn editor-btn-secondary" data-editor-role="delete" disabled>
                <i class="fa-solid fa-trash"></i><span>Delete</span>
              </button>
            </div>
          </div>

          <div class="editor-section mt-4">
            <div class="editor-form-grid-2" data-editor-role="form"></div>
          </div>

          <div class="mt-4" data-editor-role="status"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const { fieldRenderOptions } = window.EditorCoreBootstrap || EditorCore.bootstrapEditor({ mode: 'event' });

    const FLAGS = [
      'rating_system',
      'crime_score',
      'lost_gold_death',
      'spawn_full_mana',
      'allowed_pvp',
      'no_prepare_map',
      'no_multiplier',
      'no_daytime',
	  'no_moneybag',
    ];

    const parseFlags = (value) => EditorCore.utils.parseStringList(value, { unique: true });
    const serializeFlags = (value) => EditorCore.utils.stringifyStringList(value);

    const TYPES = [
      'default',
      'dungeon',
      'tutorial',
      'deep_dungeon',
      'treasure_dungeon',
      'pvp',
      'mini_games',
	  'rhythm',
	  'social',
    ];

    const worldFields = {
      Name: {
        type: 'text',
        label: 'Name',
        validate: { required: true },
        ui: {
          placeholder: 'e.g. Gridania',
          section: { title: 'Basic information', icon: 'fa-globe', subtitle: 'Name, map file and world mode' },
        },
      },
      Path: { type: 'text', label: 'Map path', validate: { required: true }, ui: { placeholder: 'main.map' } },
      Type: {
        label: 'World type',
        ui: {
          type: 'select',
          options: TYPES.map((type) => ({ value: type, label: type }))
        }
      },
      RequiredLevel: { type: 'number', label: 'Minimum level', ui: { min: 1, step: 1 } },
      RespawnWorldID: {
        type: 'db_select',
        label: 'Respawn world',
        ui: {
          dbKey: 'world',
          placeholder: '— world —',
          searchPlaceholder: 'Search a world…',
          section: { title: 'Related worlds and rules', icon: 'fa-route' },
        },
      },
      JailWorldID: { type: 'db_select', label: 'Jail world', ui: { dbKey: 'world', placeholder: '— world —', searchPlaceholder: 'Search a world…' } },
      Flags: {
        label: 'Game flags',
        ui: {
          type: 'tags',
          options: FLAGS,
          placeholder: 'Add a flag…',
          spanAll: true,
        }
      },
    };

    const dirty = EditorCore.Dirty?.create
      ? EditorCore.Dirty.create({
          root: document.querySelector('.editor-main') || document.body,
          pill: document.getElementById('dirty-pill'),
          beforeUnload: true,
        })
      : { markDirty: () => {}, setClean: () => {} };

    const filterType = document.getElementById('filterType');
    if (filterType) {
      filterType.innerHTML = [
        '<option value="">All types</option>',
        ...TYPES.map(type => `<option value=\"${type}\">${type}</option>`),
      ].join('');
    }

    const editor = EditorCore.DbEditor.mount(document.body, {
      resource: 'worlds',
      fields: worldFields,
      fieldOptions: fieldRenderOptions,
      dirty,
      transformList: (rows) => {
        const type = filterType?.value || '';
        return type ? rows.filter(row => String(row?.Type || '') === type) : rows;
      },
      defaults: () => ({
        Name: '',
        Path: '',
        Type: 'default',
        Flags: [],
        RespawnWorldID: 0,
        JailWorldID: 0,
        RequiredLevel: 1,
      }),
      rowToModel: (row) => ({
        Name: String(row?.Name || ''),
        Path: String(row?.Path || ''),
        Type: String(row?.Type || 'default'),
        Flags: parseFlags(row?.Flags),
        RespawnWorldID: Number(row?.RespawnWorldID || 0),
        JailWorldID: Number(row?.JailWorldID || 0),
        RequiredLevel: Number(row?.RequiredLevel || 1),
      }),
      modelToPayload: (model) => ({
        Name: String(model?.Name || ''),
        Path: String(model?.Path || ''),
        Type: String(model?.Type || 'default'),
        Flags: serializeFlags(model?.Flags),
        RespawnWorldID: Number(model?.RespawnWorldID || 0),
        JailWorldID: Number(model?.JailWorldID || 0),
        RequiredLevel: Math.max(1, Number(model?.RequiredLevel || 1)),
      }),
      listItem: (row) => ({
        title: row?.Name || `World #${row?.ID || 0}`,
        subtitle: `${row?.Path || '—'} · ID ${row?.ID ?? '—'}`
      }),
      getTitle: (model, id) => (id ? `World:  ${model?.Name || `#${id}`}` : 'New world'),
      getSubtitle: (model, id) => {
        if (!model) return '';
        const type = model.Type ? `Type:  ${model.Type}` : 'Type: —';
        const path = model.Path ? `Path:  ${model.Path}` : 'Path: —';
        return id ? `ID ${id} · ${type} · ${path}` : `${type} · ${path}`;
      },
      emptyTitle: 'Select a world',
      emptySubtitle: 'or create a new one',
    });

    filterType?.addEventListener('change', () => {
      editor.refresh();
    });
  </script>
</body>
</html>
