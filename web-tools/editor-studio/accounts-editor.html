<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player accounts • Editor Studio</title>
  <script src="editor-core/page-loader.js" data-mode="event"></script>
</head>

<body class="editor-theme" data-editor="accounts">
  <div class="editor-page">
    <div class="editor-page-header">
      <div class="editor-page-title">
        <i class="fa-solid fa-users-gear text-accent text-xl"></i>
        <div>
          <h1>Player accounts</h1>
          <div class="editor-page-sub">Search accounts, reset passwords and clear sign-in timeouts.</div>
        </div>
      </div>
      <div class="editor-page-actions">
        <div data-i18n-switcher-host></div>
        <button id="btn-refresh" class="editor-btn editor-btn-secondary">
          <i class="fa-solid fa-rotate"></i>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <div class="editor-page-body">
    <section class="editor-panel-card">
      <div class="flex flex-col md:flex-row gap-2 md:items-end">
        <div class="flex-grow">
          <div class="editor-label mb-1">Search by ID, login or nickname</div>
          <div class="editor-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search" type="search" class="w-full editor-input form-input" placeholder="ID, login or nickname…" autocomplete="off" />
          </div>
        </div>
        <button id="btn-search" class="editor-btn editor-btn-primary">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Find</span>
        </button>
      </div>
      <div id="status" class="mt-2 text-sm"></div>
    </section>

    <section class="editor-panel-card">
      <div class="editor-table-wrap">
        <table class="editor-table">
          <thead>
            <tr class="editor-soft border-b editor-hairline">
              <th class="text-left px-2 py-2 editor-text text-xs uppercase tracking-wide">ID</th>
              <th class="text-left px-2 py-2 editor-text text-xs uppercase tracking-wide">Login</th>
              <th class="text-left px-2 py-2 editor-text text-xs uppercase tracking-wide">Nickname</th>
              <th class="text-left px-2 py-2 editor-text text-xs uppercase tracking-wide">Current password</th>
              <th class="text-left px-2 py-2 editor-text text-xs uppercase tracking-wide">Timeout code</th>
              <th class="text-right px-2 py-2 editor-text text-xs uppercase tracking-wide">Actions</th>
            </tr>
          </thead>
          <tbody id="accounts-list"></tbody>
        </table>
      </div>
    </section>
    </div>
  </div>

  <div id="password-modal" class="hidden fixed inset-0 editor-modal-backdrop z-[520] items-center justify-center p-4">
    <div class="editor-modal-content p-4 rounded-xl shadow-xl w-full max-w-lg border editor-hairline">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="text-lg font-bold">Edit the account</h3>
          <p id="password-modal-subtitle" class="editor-muted-text text-sm mt-1"></p>
        </div>
        <button id="password-modal-close" class="editor-btn editor-btn-secondary" title="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
        <div>
          <div class="editor-label mb-1">Login</div>
          <div class="flex gap-2">
            <input id="new-login" type="text" class="w-full editor-input form-input" minlength="4" maxlength="12" autocomplete="off" />
            <button id="login-modal-save" class="editor-btn editor-btn-secondary" title="Save the login"><i class="fa-solid fa-floppy-disk"></i></button>
          </div>
          <div class="editor-muted-text text-xs mt-1">4–12 characters.</div>
        </div>
        <div>
          <div class="editor-label mb-1">New password</div>
          <div class="flex gap-2">
            <input id="new-password" type="text" class="w-full editor-input form-input" minlength="4" maxlength="12" autocomplete="off" />
            <button id="password-modal-save" class="editor-btn editor-btn-primary" title="Change the password"><i class="fa-solid fa-key"></i></button>
          </div>
          <div class="editor-muted-text text-xs mt-1">4–12 characters.</div>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="password-modal-cancel" class="editor-btn editor-btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'api/accounts.php';
    const state = { selected: null, accounts: new Map(), lastQuery: '' };

    const $ = (id) => document.getElementById(id);
    const listEl = $('accounts-list');
    const statusEl = $('status');

    const escapeHtml = EditorCore.Page.esc;
    const setStatus = (message, tone = 'info') =>
      EditorCore.utils.setStatus(statusEl, message, tone, { className: 'mt-2' });
    const fetchJson = EditorCore.utils.requestJson;

    const accountLabel = (account) => `#${account.ID} • ${account.Nick || 'no nickname'} • ${account.Username || 'no login'}`;

    const shortPassword = (password) => {
      const value = String(password || '');
      if (!value) return '—';
      return value.length > 14 ? `${value.slice(0, 14)}…` : value;
    };

    const renderRows = (rows) => {
      state.accounts = new Map((rows || []).map((row) => [String(row.ID), row]));
      if (!rows.length) {
        listEl.innerHTML = '<tr><td colspan="6" class="px-3 py-6 text-center editor-muted-text">No accounts found.</td></tr>';
        return;
      }

      listEl.innerHTML = rows.map((row) => `
        <tr class="border-b editor-hairline hover:editor-soft">
          <td class="px-2 py-1.5 font-mono editor-muted-text">${escapeHtml(row.ID)}</td>
          <td class="px-2 py-1.5"><span class="font-semibold editor-text">${escapeHtml(row.Username || '—')}</span></td>
          <td class="px-2 py-1.5 editor-muted-text">${escapeHtml(row.Nick || '—')}</td>
          <td class="px-2 py-1.5">
            <div class="flex items-center gap-1.5 max-w-[11rem]">
              <code class="font-mono text-xs editor-text truncate" title="${escapeHtml(row.Password || '')}">${escapeHtml(shortPassword(row.Password))}</code>
              ${row.Password ? `<button class="editor-btn editor-btn-secondary editor-btn--xs" data-action="copy-password" data-id="${escapeHtml(row.ID)}" title="Copy the current password"><i class="fa-solid fa-copy"></i></button>` : ''}
            </div>
          </td>
          <td class="px-2 py-1.5">
            ${row.HasTimeoutCode
              ? '<span class="editor-tone-warning font-medium"><i class="fa-solid fa-lock"></i> set</span>'
              : '<span class="editor-muted-text"><i class="fa-solid fa-unlock"></i> empty</span>'}
          </td>
          <td class="px-2 py-1.5">
            <div class="flex flex-wrap justify-end gap-1.5">
              <button class="editor-btn editor-btn-secondary editor-btn--xs" data-action="edit" data-id="${escapeHtml(row.ID)}" title="Edit the login and password">
                <i class="fa-solid fa-pen-to-square"></i><span>Edit</span>
              </button>
              <button class="editor-btn editor-btn-secondary editor-btn--xs" data-action="reset-password" data-id="${escapeHtml(row.ID)}">
                <i class="fa-solid fa-wand-magic-sparkles"></i><span>Reset the password</span>
              </button>
              <button class="editor-btn editor-btn-danger editor-btn--xs" data-action="reset-timeout" data-id="${escapeHtml(row.ID)}">
                <i class="fa-solid fa-clock-rotate-left"></i><span>Reset the timeout</span>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    };

    const loadAccounts = async () => {
      setStatus('Loading...');
      const q = $('search').value.trim();
      state.lastQuery = q;
      try {
        const json = await fetchJson(`${API}?action=list&limit=50&search=${encodeURIComponent(q)}`);
        renderRows(json.rows || []);
        setStatus(json.has_more ? 'The first 50 records are shown. Narrow the search.' : `Found:  ${(json.rows || []).length}`, json.has_more ? 'warning' : 'success');
      } catch (err) {
        listEl.innerHTML = '<tr><td colspan="6" class="px-3 py-6 text-center editor-tone-danger">Loading failed.</td></tr>';
        setStatus(err.message, 'error');
      }
    };

    const openPasswordModal = (account) => {
      state.selected = account;
      $('password-modal-subtitle').textContent = accountLabel(account);
      $('new-login').value = account.Username || '';
      $('new-password').value = '';
      $('password-modal').classList.remove('hidden');
      $('password-modal').classList.add('flex');
      setTimeout(() => $('new-login').focus(), 0);
    };

    const closePasswordModal = () => {
      $('password-modal').classList.add('hidden');
      $('password-modal').classList.remove('flex');
      state.selected = null;
    };

    const refreshAfterChange = async (accountId) => {
      await loadAccounts();
      state.selected = state.accounts.get(String(accountId)) || state.selected;
      if (state.selected && !$('password-modal').classList.contains('hidden')) {
        $('password-modal-subtitle').textContent = accountLabel(state.selected);
        $('new-login').value = state.selected.Username || '';
      }
    };

    const changePassword = async () => {
      const account = state.selected;
      if (!account) return;
      const password = $('new-password').value;
      if (password.length < 4 || password.length > 12) {
        setStatus('The password must be 4 to 12 characters long.', 'error');
        return;
      }
      try {
        await fetchJson(`${API}?action=change_password`, { method: 'POST', body: { account_id: account.ID, password } });
        await refreshAfterChange(account.ID);
        $('new-password').value = '';
        setStatus(`Password for  ${accountLabel(state.selected || account)}  changed.`, 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    };

    const changeLogin = async () => {
      const account = state.selected;
      if (!account) return;
      const login = $('new-login').value.trim();
      if (login.length < 4 || login.length > 12) {
        setStatus('The login must be 4 to 12 characters long.', 'error');
        return;
      }
      try {
        await fetchJson(`${API}?action=change_login`, { method: 'POST', body: { account_id: account.ID, login } });
        await refreshAfterChange(account.ID);
        setStatus(`Login for  ${accountLabel(state.selected || account)}  changed.`, 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    };

    const resetPassword = async (account) => {
      if (!await EditorCore.Page.confirm(`Reset the password for  ${accountLabel(account)}? A new password will be generated automatically.`)) return;
      try {
        const json = await fetchJson(`${API}?action=reset_password`, { method: 'POST', body: { account_id: account.ID } });
        const password = json.password || '';
        await navigator.clipboard?.writeText(password).catch(() => {});
        const T = EditorCore.Page.t;
        await EditorCore.Page.alert(`${T('New password for  {0}:', [accountLabel(account)])}\n\n${password}\n\n${T('Copy it and pass it to the user.')}`);
        await loadAccounts();
        setStatus(`Password for  ${accountLabel(account)}  has been reset. The new password is shown in the dialog.`, 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    };

    const resetTimeout = async (account) => {
      if (!await EditorCore.Page.confirm(`Reset the session timeout for  ${accountLabel(account)}?`)) return;
      try {
        await fetchJson(`${API}?action=reset_timeout_code`, { method: 'POST', body: { account_id: account.ID } });
        await loadAccounts();
        setStatus(`The timeout code for  ${accountLabel(account)}  has been reset.`, 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    };

    listEl.addEventListener('click', async (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;
      const account = state.accounts.get(String(btn.dataset.id));
      if (!account) return;
      if (btn.dataset.action === 'edit') openPasswordModal(account);
      if (btn.dataset.action === 'reset-password') resetPassword(account);
      if (btn.dataset.action === 'reset-timeout') resetTimeout(account);
      if (btn.dataset.action === 'copy-password') {
        try {
          await navigator.clipboard.writeText(account.Password || '');
          setStatus(`The current password for  ${accountLabel(account)}  has been copied.`, 'success');
        } catch {
          setStatus('Could not copy the password to the clipboard.', 'error');
        }
      }
    });

    $('btn-search').addEventListener('click', loadAccounts);
    $('btn-refresh').addEventListener('click', loadAccounts);
    $('search').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadAccounts();
    });
    $('password-modal-save').addEventListener('click', changePassword);
    $('login-modal-save').addEventListener('click', changeLogin);
    $('password-modal-close').addEventListener('click', closePasswordModal);
    $('password-modal-cancel').addEventListener('click', closePasswordModal);
    $('password-modal').addEventListener('click', (event) => {
      if (event.target.id === 'password-modal') closePasswordModal();
    });
    $('new-password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') changePassword();
    });
    $('new-login').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') changeLogin();
    });

    loadAccounts();
  </script>
</body>
</html>
