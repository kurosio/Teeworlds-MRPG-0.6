<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeons • Editor Studio</title>
  <script src="editor-core/page-loader.js" data-mode="event"></script>
</head>

<body class="editor-theme" data-editor="dungeons">
  <div class="editor-page">
    <div class="editor-page-header">
      <div class="editor-page-title">
        <i class="fa-solid fa-dungeon text-accent text-xl"></i>
        <div>
          <h1>Dungeons</h1>
          <div class="editor-page-sub">World entrance, scenario and time limit.</div>
        </div>
      </div>
      <div class="editor-page-actions">
        <button class="editor-btn editor-btn-secondary" data-editor-role="refresh">
          <i class="fa-solid fa-rotate"></i><span>Refresh</span>
        </button>
        <button class="editor-btn editor-btn-primary" data-editor-role="new">
          <i class="fa-solid fa-plus"></i><span>New dungeon</span>
        </button>
      </div>
    </div>

    <div class="editor-shell editor-shell--docked">
      <aside class="editor-sidebar editor-dock-sidebar">
        <div class="editor-dock-pad">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold">Dungeon list</div>
              <div class="text-xs editor-muted-text">Total: <span data-editor-role="count">—</span></div>
            </div>
          </div>

          <div class="mt-3">
            <div class="editor-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input data-editor-role="search" type="search" class="w-full editor-input form-input" placeholder="Search by ID or world…" />
            </div>
          </div>

          <div class="mt-3 editor-sidebar-filters">
            <select id="filterWorld" class="w-full editor-input form-input" data-datasource="worlds" data-label-mode="id_name" data-db-searchable="0" data-db-limit="300" data-value-type="number">
              <option value="">All worlds</option>
            </select>
          </div>

          <div class="mt-4 editor-sidebar-list editor-scroll" data-editor-role="list"></div>
        </div>
      </aside>

      <section class="editor-main editor-dock-main">
        <div class="editor-dock-pad">
          <div class="editor-sticky-toolbar flex items-start justify-between gap-4">
            <div>
              <div class="text-lg font-semibold" data-editor-role="title">Select a dungeon</div>
              <div class="editor-muted-text text-sm mt-1" data-editor-role="subtitle">or create a new one</div>
            </div>
            <div class="editor-page-actions">
              <span id="dirty-pill" class="editor-dirty-pill hidden">Data not saved</span>
              <button class="editor-btn editor-btn-primary" data-editor-role="save" disabled>
                <i class="fa-solid fa-floppy-disk"></i><span>Save</span>
              </button>
              <button class="editor-btn editor-btn-secondary hidden" data-editor-role="cancel" disabled>
                <i class="fa-solid fa-rotate-left"></i><span>Cancel</span>
              </button>
              <button class="editor-btn editor-btn-secondary" data-editor-role="delete" disabled>
                <i class="fa-solid fa-trash"></i><span>Delete</span>
              </button>
            </div>
          </div>

          <div class="editor-section mt-4">
            <div class="editor-form-grid-2" data-editor-role="form"></div>
          </div>

          <div class="mt-4" data-editor-role="status"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const { fieldRenderOptions } = window.EditorCoreBootstrap || EditorCore.bootstrapEditor({ mode: 'event' });

    const toNullableInt = (value, fallback = 0) => EditorCore.utils.toNullableInt(value, fallback);

    const worldsMap = new Map();
    const formatWorldLabel = (worldId) => {
      const id = Number(worldId ?? 0);
      if (!Number.isFinite(id) || id < 0) return '—';
      const name = worldsMap.get(String(id));
      if (name) return `${name} (#${id})`;
      return id ? `World #${id}` : 'World #0';
    };

    const fields = {
      WorldID: { type: 'db_select', label: 'Dungeon world', validate: { required: true }, ui: { dbKey: 'world', placeholder: '— world —', searchPlaceholder: 'Search a world…' } },
      TimeLimit: { type: 'number', label: 'Time limit (sec.)', ui: { min: 0, step: 1, help: 'Time limit in seconds (for example, 600 = 10 minutes).' } },
      // Точка входа: дверь ставят по центрам тайлов, игровой слой виден сразу.
      Door: {
        type: 'vec2',
        label: 'Entry point (Door X, Y)',
        ui: { step: 1, axes: { x: 'DoorX', y: 'DoorY' }, mapWorldPath: 'WorldID', showTiles: true, grid: true, snap: true, spanAll: true },
      },
      // Компоненты сценария подземелья открывают карту в мире подземелья.
      Scenario: { type: 'scenario', label: 'Dungeon scenario', ui: { scenarioMode: 'dungeon', mapWorldPath: 'WorldID', spanAll: true } },
    };

    const dirty = EditorCore.Dirty?.create
      ? EditorCore.Dirty.create({
          root: document.querySelector('.editor-main') || document.body,
          pill: document.getElementById('dirty-pill'),
          beforeUnload: true,
        })
      : { markDirty: () => {}, setClean: () => {} };

    const filterWorld = document.getElementById('filterWorld');

    const editor = EditorCore.DbEditor.mount(document.body, {
      resource: 'dungeons',
      fields,
      fieldOptions: fieldRenderOptions,
      dirty,
      transformList: (rows) => {
        const world = filterWorld?.value ?? '';
        if (world === '') return rows;
        const wNum = Number(world);
        return rows.filter(row => Number(row?.WorldID ?? -1) === wNum);
      },
      defaults: () => ({
        WorldID: 0,
        DoorX: 0,
        DoorY: 0,
        Scenario: '',
        TimeLimit: 600,
      }),
      rowToModel: (row) => ({
        WorldID: Number(row?.WorldID ?? 0),
        DoorX: Number(row?.DoorX ?? 0),
        DoorY: Number(row?.DoorY ?? 0),
        Scenario: row?.Scenario == null ? '' : String(row?.Scenario),
        TimeLimit: Number(row?.TimeLimit ?? 600),
      }),
      modelToPayload: (model) => ({
        WorldID: toNullableInt(model?.WorldID, 0),
        DoorX: toNullableInt(model?.DoorX, 0),
        DoorY: toNullableInt(model?.DoorY, 0),
        Scenario: model?.Scenario ? String(model.Scenario) : null,
        TimeLimit: toNullableInt(model?.TimeLimit, 600),
      }),
      listItem: (row) => {
        const wName = worldsMap.get(String(row?.WorldID ?? ''));
        return {
          title: wName ? `Dungeon #${row?.ID || 0} — ${wName}` : `Dungeon #${row?.ID || 0}`,
          subtitle: `${formatWorldLabel(row?.WorldID)}  · Limit  ${row?.TimeLimit ?? 600}  sec cooldown.`,
        };
      },
      getTitle: (model, id) => {
        const wName = worldsMap.get(String(model?.WorldID ?? ''));
        if (id) return wName ? `Dungeon #${id} (${wName})` : `Dungeon #${id}`;
        return 'New dungeon';
      },
      getSubtitle: (model, id) => {
        if (!model) return '';
        const world = formatWorldLabel(model?.WorldID);
        const limit = `Limit:  ${model?.TimeLimit ?? 600}  sec cooldown.`;
        return id ? `ID ${id} · ${world} · ${limit}` : `${world} · ${limit}`;
      },
      emptyTitle: 'Select a dungeon',
      emptySubtitle: 'or create a new one',
    });

    filterWorld?.addEventListener('change', () => {
      editor.refresh();
    });

    EditorCore.DB?.list?.('worlds', { limit: 1000 })?.then((res) => {
      if (!res?.ok || !Array.isArray(res.items)) return;
      res.items.forEach((it) => worldsMap.set(String(it.value), String(it.label || '')));
      editor.refresh();
    }).catch(() => {});
  </script>
</body>
</html>
