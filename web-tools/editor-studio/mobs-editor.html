<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobs • Editor Studio</title>
  <script src="editor-core/page-loader.js" data-mode="scenario"></script>
</head>

<body class="editor-theme" data-editor="mobs">
  <div class="editor-page">
    <div class="editor-page-header">
      <div class="editor-page-title">
        <i class="fa-solid fa-skull text-accent text-xl"></i>
        <div>
          <h1>Mobs</h1>
          <div class="editor-page-sub">Spawn settings: mob, world and spawn parameters.</div>
        </div>
      </div>
      <div class="editor-page-actions">
        <button id="refreshBtn" class="editor-btn editor-btn-secondary" title="Refresh">
          <i class="fa-solid fa-rotate"></i><span>Refresh</span>
        </button>
        <button id="newBtn" class="editor-btn editor-btn-primary">
          <i class="fa-solid fa-plus"></i><span>New spawn</span>
        </button>
      </div>
    </div>

    <div class="editor-shell editor-shell--docked">
      <aside id="sidebar" class="editor-sidebar editor-dock-sidebar">
        <div class="editor-dock-pad">
          <div class="editor-sidebar-head">
            <div>
              <div class="text-sm font-semibold">Spawn list</div>
              <div class="editor-sidebar-meta">Total: <span id="count">—</span></div>
            </div>
          </div>

          <div class="mt-3">
            <div class="editor-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input id="searchInput" class="w-full editor-input form-input" placeholder="Search: ID / mob name / world" />
            </div>
          </div>

          <div class="mt-3 space-y-2">
            <select id="filterMob" class="w-full editor-input form-input" data-datasource="bots" data-label-mode="id_name" data-db-searchable="1" data-db-limit="300" data-value-type="number">
              <option value="">All mobs</option>
            </select>
            <div class="editor-sidebar-filters two-col">
              <select id="filterWorld" class="w-full editor-input form-input" data-datasource="worlds" data-label-mode="id_name" data-db-searchable="0" data-db-limit="300" data-value-type="number">
                <option value="">All worlds</option>
              </select>
              <select id="filterBoss" class="w-full editor-input form-input">
                <option value="">All types</option>
                <option value="boss">Boss only</option>
                <option value="regular">Regular</option>
              </select>
            </div>
          </div>

          <div id="list" class="mt-4 editor-sidebar-list editor-scroll"></div>

          <div class="mt-3">
            <button id="moreBtn" class="w-full editor-btn editor-btn-secondary hidden">
              <i class="fa-solid fa-angles-down"></i>
              <span>Load more</span>
            </button>
          </div>
        </div>
      </aside>

      <main class="editor-main editor-dock-main">
        <div class="editor-dock-pad">
          <div class="editor-sticky-toolbar flex items-start justify-between gap-4">
            <div class="min-w-0">
              <div class="text-lg font-semibold" id="title">Select a mob</div>
              <div class="editor-muted-text text-sm mt-1" id="subtitle">or create a new spawn</div>
            </div>
            <div class="editor-page-actions">
              <span id="dirty-pill" class="editor-dirty-pill hidden" aria-hidden="true">Data not saved</span>
              <button id="saveBtn" class="editor-btn editor-btn-primary" disabled>
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save</span>
              </button>
              <button id="cancelBtn" class="editor-btn editor-btn-secondary hidden" disabled>
                <i class="fa-solid fa-rotate-left"></i>
                <span>Cancel</span>
              </button>
              <button id="deleteBtn" class="editor-btn editor-btn-secondary" disabled>
                <i class="fa-solid fa-trash"></i>
                <span>Delete</span>
              </button>
            </div>
          </div>

          <div class="mt-4 space-y-4">
            <div id="dbStatus" class="editor-db-alert hidden"></div>

            <div class="editor-panel-card">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div class="font-semibold">Spawn parameters</div>
                  <div class="editor-muted-text text-sm">Lookups display names while IDs are saved to the database</div>
                </div>
                <div id="tabRoot"></div>
              </div>

              <div class="mt-4">
                <div id="tab_basic" class="space-y-6"></div>
                <div id="tab_ai" class="space-y-6 hidden"></div>
                <div id="tab_drop" class="space-y-6 hidden"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <!-- Core -->

  <script>
    const esc = EditorCore.Page.esc;

    const DOM = {
      list: document.getElementById('list'),
      search: document.getElementById('searchInput'),
      count: document.getElementById('count'),
      refresh: document.getElementById('refreshBtn'),
      newBtn: document.getElementById('newBtn'),
      title: document.getElementById('title'),
      subtitle: document.getElementById('subtitle'),
      save: document.getElementById('saveBtn'),
      cancel: document.getElementById('cancelBtn'),
      del: document.getElementById('deleteBtn'),
      dbStatus: document.getElementById('dbStatus'),
      sidebar: document.getElementById('sidebar'),
      more: document.getElementById('moreBtn'),
      filterMob: document.getElementById('filterMob'),
      filterWorld: document.getElementById('filterWorld'),
      filterBoss: document.getElementById('filterBoss'),
      tabRoot: document.getElementById('tabRoot'),
      tabBasic: document.getElementById('tab_basic'),
      tabAi: document.getElementById('tab_ai'),
      tabDrop: document.getElementById('tab_drop'),
    };

    // Shared "unsaved changes" indicator (like in crafts)
    const DIRTY = window.EditorCore?.Dirty?.create
      ? window.EditorCore.Dirty.create({
          root: document.querySelector('main') || document,
          pill: document.getElementById('dirty-pill'),
          beforeUnload: true,
        })
      : null;

    const RESOURCE = 'bots_mobs';
    const fieldOptions = window.EditorCore.defaults.getFieldRenderOptions('scenario');

    const DEBUFFS = ['Slowdown', 'Poison', 'Fire'];
    const BEHAVIORS = ['sleepy', 'slower', 'poisonous', 'neutral', 'skills_base', 'skills_tank', 'skills_dps', 'skills_healer', 'ambient_chat'];

    const emptyMob = () => ({
      ID: 0,
      BotID: 0,
      WorldID: 0,
      PositionX: 0,
      PositionY: 0,
      Debuffs: [],
      Behavior: [],
      Level: 1,
      Power: 10,
      Number: 1,
      Respawn: 1,
      Radius: 800,
	  ActiveRadius: 0,
      Boss: 0,
      drops: [],
    });

    const splitSet = (value, allowed = null) =>
      EditorCore.utils.parseStringList(value, { allowed });

    const joinSet = (value) => EditorCore.utils.stringifyStringList(value);

    const parsePipeNums = (s, asFloat = false) => {
      const raw = String(s || '');
      const parts = raw.split('|').filter(x => x !== '');
      const out = parts.map(p => asFloat ? parseFloat(p) : parseInt(p, 10)).map(n => Number.isFinite(n) ? n : 0);
      while (out.length < 5) out.push(0);
      return out.slice(0, 5);
    };

    const buildPipeNums = (arr) => {
      const a = Array.isArray(arr) ? arr : [];
      const five = Array.from({ length: 5 }, (_, i) => {
        const v = a[i];
        const n = (typeof v === 'number') ? v : parseFloat(String(v || '0'));
        return Number.isFinite(n) ? n : 0;
      });
      return `|${five.join('|')}|`;
    };

    const fromRow = (row) => {
      const m = emptyMob();
      m.ID = Number(row.ID || 0);
      m.BotID = Number(row.BotID || 0);
      m.WorldID = Number(row.WorldID || 0);
      m.PositionX = Number(row.PositionX || 0);
      m.PositionY = Number(row.PositionY || 0);
      m.Debuffs = splitSet(row.Debuffs, DEBUFFS);
      m.Behavior = splitSet(row.Behavior, BEHAVIORS);
      m.Level = Number(row.Level || 1);
      m.Power = Number(row.Power || 10);
      m.Number = Number(row.Number || 1);
      m.Respawn = Number(row.Respawn || 1);
      m.Radius = Number(row.Radius || 800);
      m.ActiveRadius = Number(row.ActiveRadius || 0);
      m.Boss = Number(row.Boss || 0) ? 1 : 0;
      const counts = parsePipeNums(row.it_drop_count, false);
      const chances = parsePipeNums(row.it_drop_chance, true);
      const rawItems = [row.it_drop_0, row.it_drop_1, row.it_drop_2, row.it_drop_3, row.it_drop_4];

      // IMPORTANT: hide NULL drop slots in UI (NULL in DB means "no slot")
      const pairs = rawItems.map((x, i) => ({
        item_id: (x === null || x === undefined) ? 0 : Number(x || 0),
        count: Number(counts[i] || 0),
        chance: Number(chances[i] || 0),
      }));
      m.drops = pairs.filter(p => Number(p.item_id || 0) > 0);
      return m;
    };

    const toPayload = (m) => {
      const src = Array.isArray(m.drops) ? m.drops.slice(0, 5) : [];
      // Compact: keep only реально выбранные предметы (item_id > 0)
      const compact = src.filter(d => Number(d?.item_id || 0) > 0).slice(0, 5);
      // Pad to 5 slots (DB schema)
      const padded = compact.concat(Array.from({ length: Math.max(0, 5 - compact.length) }, () => ({ item_id: null, count: 0, chance: 0 })));

      const itemCols = padded.map(d => {
        const id = Number(d?.item_id || 0);
        return id > 0 ? id : null;
      });

      // If slot is empty (NULL in DB) we force count/chance to 0
      const counts = padded.map(d => (Number(d?.item_id || 0) > 0) ? Number(d?.count || 0) : 0);
      const chances = padded.map(d => {
        if (Number(d?.item_id || 0) <= 0) return 0;
        const n = parseFloat(String(d?.chance ?? 0));
        return Number.isFinite(n) ? n : 0;
      });

      return {
        BotID: Number(m.BotID || 0),
        WorldID: Number(m.WorldID || 0) > 0 ? Number(m.WorldID) : null,
        PositionX: Number(m.PositionX || 0),
        PositionY: Number(m.PositionY || 0),
        Debuffs: joinSet(m.Debuffs),
        Behavior: joinSet(m.Behavior),
        Level: Number(m.Level || 1),
        Power: Number(m.Power || 10),
        Number: Number(m.Number || 1),
        Respawn: Number(m.Respawn || 1),
        Radius: Number(m.Radius || 800),
        ActiveRadius: Number(m.ActiveRadius || 0),
        Boss: Number(m.Boss || 0) ? 1 : 0,
        it_drop_0: itemCols[0],
        it_drop_1: itemCols[1],
        it_drop_2: itemCols[2],
        it_drop_3: itemCols[3],
        it_drop_4: itemCols[4],
        it_drop_count: buildPipeNums(counts),
        it_drop_chance: buildPipeNums(chances),
      };
    };

    const getLabelMap = EditorCore.utils.loadLookupMap;

    const formatMobTitle = (row) => {
      const bot = STATE.lookups.bots.get(String(row.BotID)) || '';
      return bot ? bot : `BotID: ${row.BotID}`;
    };

    const formatWorld = (id) => {
      const w = STATE.lookups.worlds.get(String(id)) || '';
      return w ? w : (id ? `#${id}` : '—');
    };

    const cloneData = EditorCore.utils.cloneData;

    const setActionButtons = (enabled) => {
      const canCancel = enabled && !!DIRTY?.isDirty?.();
      DOM.save.disabled = !enabled;
      DOM.del.disabled = !enabled || !STATE.selectedId;
      DOM.cancel.disabled = !canCancel;
      DOM.cancel.classList.toggle('hidden', !canCancel);
    };

    const setHeader = () => {
      if (!STATE.mob) {
        DOM.title.textContent = 'Select a mob';
        DOM.subtitle.textContent = 'or create a new spawn';
        setActionButtons(false);
        return;
      }
      const name = STATE.lookups.bots.get(String(STATE.mob.BotID)) || `BotID: ${STATE.mob.BotID}`;
      const world = formatWorld(STATE.mob.WorldID);
      DOM.title.textContent = STATE.mob.ID ? `${name}` : 'New spawn';
      DOM.subtitle.textContent = `ID: ${STATE.mob.ID || '—'}  • World:  ${world}  • Level:  ${STATE.mob.Level || 1}`;
      setActionButtons(true);
    };

    const isNumericSearch = (s) => /^\d+$/.test(String(s || '').trim());

    const applyClientFilters = (rows) => {
      const q = String(DOM.search.value || '').trim().toLowerCase();
      const mobFilter = Number(DOM.filterMob.value || 0);
      const worldFilter = Number(DOM.filterWorld.value || 0);
      const bossFilter = DOM.filterBoss?.value || '';

      return rows.filter(r => {
        if (mobFilter > 0 && Number(r.BotID) !== mobFilter) return false;
        if (worldFilter > 0 && Number(r.WorldID) !== worldFilter) return false;
        if (bossFilter === 'boss' && Number(r.Boss || 0) !== 1) return false;
        if (bossFilter === 'regular' && Number(r.Boss || 0) === 1) return false;

        if (!q) return true;
        if (isNumericSearch(q)) {
          const id = String(r.ID || '');
          const botId = String(r.BotID || '');
          return id.includes(q) || botId.includes(q);
        }

        const bot = (STATE.lookups.bots.get(String(r.BotID)) || '').toLowerCase();
        const world = (STATE.lookups.worlds.get(String(r.WorldID)) || '').toLowerCase();
        return bot.includes(q) || world.includes(q) || String(r.ID || '').includes(q);
      });
    };

    const renderList = () => {
      const filtered = applyClientFilters(STATE.list);

      if (!STATE.list.length) {
        if (DOM.count) DOM.count.textContent = '0';
        DOM.list.innerHTML = `<div class="editor-empty-state">No spawns yet — click “New spawn” to create a record.</div>`;
        return;
      }

      if (DOM.count) {
        DOM.count.textContent = filtered.length < STATE.list.length
          ? `${filtered.length}  of  ${STATE.list.length}`
          : `${STATE.list.length}`;
      }

      if (!filtered.length) {
        DOM.list.innerHTML = `<div class="editor-empty-state">Nothing matches the filters</div>`;
        return;
      }

      const listHtml = filtered.map(r => {
        const active = r.ID === STATE.selectedId;
        const title = formatMobTitle(r);
        const world = formatWorld(r.WorldID);
        const skinInfo = STATE.lookups.botSkins?.get(String(r.BotID));
        const skinUrl = (skinInfo && STATE.skinsApi)
          ? window.EditorCore.utils.renderSkinApiUrl(STATE.skinsApi, skinInfo)
          : '';
        const skinPreview = skinUrl
          ? `<img class="w-9 h-9 rounded-full border editor-hairline object-cover shrink-0" src="${esc(skinUrl)}" alt="" loading="lazy" />`
          : `<div class="w-9 h-9 rounded-full border editor-hairline editor-soft shrink-0 flex items-center justify-center text-[10px] editor-muted-text">—</div>`;
        const bossBadge = Number(r.Boss || 0)
          ? `<span class="editor-badge" style="color: var(--editor-danger);">Boss</span>`
          : '';
        return `
          <button type="button" class="w-full text-left editor-row ${active ? 'editor-row-active' : ''}" data-id="${r.ID}">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0 flex items-center gap-3">
                ${skinPreview}
                <div class="min-w-0">
                  <div class="font-semibold truncate">${esc(title)}</div>
                  <div class="text-xs editor-muted-text truncate">ID ${r.ID} · ${esc(world)}  · Lvl.  ${r.Level ?? ''} · X ${r.PositionX ?? ''}, Y ${r.PositionY ?? ''}</div>
                </div>
              </div>
              ${bossBadge}
            </div>
          </button>
        `;
      }).join('');
      DOM.list.innerHTML = `<div class="editor-list">${listHtml}</div>`;

      DOM.list.querySelectorAll('[data-id]').forEach(btn => {
        btn.addEventListener('click', () => selectMob(Number(btn.getAttribute('data-id')), { confirmDirty: true }));
      });
    };

    const renderTabs = () => {
      window.EditorCore.UI.mountTabs(DOM.tabRoot, {
        tabs: [
          { id: 'basic', title: 'General', icon: 'fa-sliders' },
          { id: 'ai', title: 'AI / effects', icon: 'fa-brain' },
          { id: 'drop', title: 'Drop', icon: 'fa-gift' },
        ],
        active: STATE.activeTab,
        onChange: (id) => {
          STATE.activeTab = id;
          syncTabVisibility();
        }
      });
      syncTabVisibility();
    };

    const syncTabVisibility = () => {
      DOM.tabBasic.classList.toggle('hidden', STATE.activeTab !== 'basic');
      DOM.tabAi.classList.toggle('hidden', STATE.activeTab !== 'ai');
      DOM.tabDrop.classList.toggle('hidden', STATE.activeTab !== 'drop');
    };

    const fieldsBasic = {
      BotID: { type: 'db_select', label: 'Mob (BotID)', validate: { required: true }, ui: { dbKey: 'mob', placeholder: '— select a mob —', searchPlaceholder: 'Search a mob…' } },
      WorldID: { type: 'db_select', label: 'World (WorldID)', ui: { dbKey: 'world', placeholder: '— select a world —', searchPlaceholder: 'Search a world…' } },
      // Позиция моба: нельзя ставить на стены/смерть/без крюка, видны спавны
      // и радиус блуждания — всё это флаги общего PositionPicker.
      _pos: {
        type: 'vec2',
        label: 'Position (X, Y)',
        ui: {
          min: 0,
          step: 1,
          axes: { x: 'PositionX', y: 'PositionY' },
          mapWorldPath: 'WorldID',
          safeTiles: false,
          highlightTiles: [209],
          radiusPath: 'Radius',
          grid: false,
          snap: true,
        },
      },
      Level: { type: 'number', label: 'Level', ui: { min: 1, step: 1 } },
      Power: { type: 'number', label: 'Power', ui: { min: 0, step: 1 } },
      Number: { type: 'number', label: 'Spawn count', ui: { min: 1, step: 1 } },
      Respawn: { type: 'number', label: 'Respawn (sec)', ui: { min: 0, step: 1 } },
      Radius: { type: 'number', label: 'Wander radius', ui: { min: 0, step: 1 } },
      ActiveRadius: { type: 'number', label: 'Active radius (0 — default)', ui: { min: 0, step: 1 } },
      Boss: { type: 'toggle', label: 'Boss' },
    };

    // Поля стихийных умений и дропа.
    const fieldsAi = {
      Debuffs: {
        label: 'Applied debuffs (Debuffs)',
        help: 'Choose status effects the mob can apply on hit.',
        ui: EditorCore.presets.tags({
          options: DEBUFFS,
          placeholder: 'Add effect…'
        })
      },
      Behavior: {
        label: 'Behaviour & skills (Behavior)',
        help: 'AI tag set: aggression, elemental traits and class abilities.',
        ui: EditorCore.presets.tags({
          options: BEHAVIORS,
          placeholder: 'Add behaviour…'
        })
      },
    };

    const fieldsDrop = {
      drops: {
        type: 'list',
        label: 'Drop table (up to 5 slots)',
        ui: {
          addLabel: 'Add drop slot',
          listMode: 'table',
          tableHeader: ['Item', 'Quantity', 'Chance (%)'],
          tableCols: 'minmax(0,1fr) 130px 130px',
          tableColsMd: 'minmax(0,1fr) 150px 150px',
          emptyMessage: 'No drops configured. Click “Add drop slot”.',
        },
        itemDefault: { item_id: 0, count: 1, chance: 10 },
        itemFields: {
          item_id: { type: 'db_select', label: 'Item', ui: { dbKey: 'item', placeholder: '— item —', searchPlaceholder: 'Search an item…', searchServer: true, dbLimit: 1000 } },
          count: { type: 'number', label: 'Quantity', ui: { min: 0, step: 1 } },
          chance: { type: 'number', label: 'Chance (%)', ui: { min: 0, step: 0.1 } },
        }
      }
    };

    const bindSection = (root, fields) => {
      if (!root) return;
      const fr = window.EditorCore.FieldRenderer;
      const render = () => {
        if (!STATE.mob) {
          root.innerHTML = `<div class="editor-empty-state">Select a mob spawn on the left or click “New spawn”.</div>`;
          return;
        }

        // Моб и мир — в одну строку, позиция — общим элементом X/Y с картой.
        if (fields === fieldsBasic) {
          const header = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>${window.EditorCore.FieldRenderer.renderField({ path: 'BotID', field: fieldsBasic.BotID, data: STATE.mob, options: fieldOptions })}</div>
              <div>${window.EditorCore.FieldRenderer.renderField({ path: 'WorldID', field: fieldsBasic.WorldID, data: STATE.mob, options: fieldOptions })}</div>
            </div>
            ${window.EditorCore.FieldRenderer.renderField({ path: '_pos', field: fieldsBasic._pos, data: STATE.mob, options: fieldOptions })}
          `;
          const restFields = {
            Level: fieldsBasic.Level,
            Power: fieldsBasic.Power,
            Number: fieldsBasic.Number,
            Respawn: fieldsBasic.Respawn,
            Radius: fieldsBasic.Radius,
            ActiveRadius: fieldsBasic.ActiveRadius,
            Boss: fieldsBasic.Boss,
          };
          const rest = window.EditorCore.FieldRenderer.renderFields({ fields: restFields, data: STATE.mob, options: fieldOptions });
          root.innerHTML = `${header}<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${rest}</div>`;
        } else {
          root.innerHTML = fr.renderFields({ fields, data: STATE.mob, options: fieldOptions });
        }

        window.EditorCore.UIManager.init(root);

        root.querySelectorAll('[data-path]').forEach((el) => {
          const handler = () => {
            const path = el.getAttribute('data-path');
            const val = fr.getInputValue(el);
            fr.setValueAtPath(STATE.mob, path, val);

            if (el.type === 'checkbox' && el.closest('.editor-toggle')) {
              el.closest('.editor-toggle')?.setAttribute('data-checked', el.checked ? '1' : '0');
            }

            // enforce max 5 drops
            if (path === 'drops' && Array.isArray(STATE.mob.drops)) {
              STATE.mob.drops = STATE.mob.drops.slice(0, 5);
            }
            DIRTY?.markDirty?.();
            setHeader();
            setActionButtons(true);
          };
          el.addEventListener('input', handler);
          el.addEventListener('change', handler);
        });

        root.querySelectorAll('[data-list-action]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const action = btn.getAttribute('data-list-action');
            const listPath = btn.getAttribute('data-list-path');
            const arr = Array.isArray(fr.getValueAtPath(STATE.mob, listPath)) ? fr.getValueAtPath(STATE.mob, listPath) : [];
            if (action === 'add') {
              const payload = btn.getAttribute('data-list-default') || '';
              let def = {};
              try { def = JSON.parse(decodeURIComponent(payload)); } catch { def = {}; }

              if (listPath === 'drops') {
                if (arr.length >= 5) {
                  window.EditorCore.UI.toast('Up to 5 drop slots', 'warning');
                  return;
                }

                // If DB slot was NULL, new slot should auto-pick the first item
                const firstId = Number(STATE?.defaults?.firstItemId || 0);
                if (!Number(def?.item_id || 0) && firstId > 0) def.item_id = firstId;
                // sensible defaults
                if (!Number.isFinite(Number(def?.count))) def.count = 1;
                if (Number(def.count) <= 0) def.count = 1;
                if (!Number.isFinite(Number(def?.chance))) def.chance = 0;
              }

              arr.push(def);
              fr.setValueAtPath(STATE.mob, listPath, arr);
              render();
              setHeader();
              DIRTY?.markDirty?.();
              setActionButtons(true);
            }
            if (action === 'remove') {
              const idx = Number(btn.getAttribute('data-list-index'));
              if (Number.isFinite(idx) && idx >= 0 && idx < arr.length) {
                arr.splice(idx, 1);
                fr.setValueAtPath(STATE.mob, listPath, arr);
                render();
                setHeader();
                DIRTY?.markDirty?.();
                setActionButtons(true);
              }
            }
          });
        });
      };

      return { render };
    };

    let SECTIONS = null;

    const renderForm = () => {
      SECTIONS = {
        basic: bindSection(DOM.tabBasic, fieldsBasic),
        ai: bindSection(DOM.tabAi, fieldsAi),
        drop: bindSection(DOM.tabDrop, fieldsDrop),
      };
      SECTIONS.basic?.render();
      SECTIONS.ai?.render();
      SECTIONS.drop?.render();
    };

    const showDbStatus = async () => {
      const test = await window.EditorCore.DB.testConnection();
      if (test.ok) {
        DOM.dbStatus.textContent = '';
        DOM.dbStatus.classList.add('hidden');
      } else {
        DOM.dbStatus.textContent = 'DB: no connection. The reference list falls back to manual ID input.';
        DOM.dbStatus.classList.remove('hidden');
      }
    };

    const canDiscardDirty = async () => {
      if (!DIRTY?.isDirty?.()) return true;
      return EditorCore.Page.confirm('You have unsaved changes. Continue without saving?');
    };

    const loadLookups = async () => {
      STATE.lookups.bots = await getLabelMap('bots');
      STATE.lookups.worlds = await getLabelMap('worlds');
      STATE.lookups.botSkins = await EditorCore.utils.getBotSkinsMap();
      STATE.skinsApi = await EditorCore.utils.getSkinsApi();
    };

    const loadDefaults = async () => {
      // Used when user clicks "Добавить слот" для дропа
      STATE.defaults.firstItemId = 0;
      try {
        const res = await window.EditorCore.DB.list('items', { limit: 1, offset: 0 });
        const id = Number(res?.items?.[0]?.value || 0);
        if (res?.ok && id > 0) STATE.defaults.firstItemId = id;
      } catch (e) {
        // ignore
      }
    };

    const loadList = async ({ reset = false } = {}) => {
      if (reset) {
        STATE.offset = 0;
        STATE.list = [];
        STATE.hasMore = true;
      }

      const q = String(DOM.search.value || '').trim();
      const numeric = isNumericSearch(q);
      const limit = 220;

      if (!STATE.hasMore) return;

      try {
        const res = await window.EditorCore.DBCrud.list(RESOURCE, {
          search: numeric ? q : '',
          limit,
          offset: STATE.offset,
        });
        const rows = Array.isArray(res.rows) ? res.rows : [];
        STATE.list = STATE.list.concat(rows);
        STATE.offset += rows.length;
        STATE.hasMore = rows.length === limit;
      } catch (e) {
        window.EditorCore.UI.toast(e.message || 'Loading the list failed', 'error');
        STATE.hasMore = false;
      }

      DOM.more.classList.toggle('hidden', !STATE.hasMore);
      renderList();
    };

    const selectMob = async (id, { confirmDirty = false } = {}) => {
      if (!id) return;
      if (id === STATE.selectedId && STATE.mob && confirmDirty) return;
      if (confirmDirty && !await canDiscardDirty()) return;
      try {
        const res = await window.EditorCore.DBCrud.get(RESOURCE, id);
        STATE.selectedId = id;
        STATE.mob = fromRow(res.row);
        STATE.persistedMob = cloneData(STATE.mob);
        DIRTY?.setClean();
        renderList();
        renderForm();
        setHeader();
        STATE._closeDrawer?.();
      } catch (e) {
        window.EditorCore.UI.toast(e.message || 'Loading the record failed', 'error');
      }
    };

    const newMob = async () => {
      if (!await canDiscardDirty()) return;
      STATE.lastSelectedIdBeforeCreate = Number(STATE.selectedId || 0);
      STATE.selectedId = 0;
      STATE.mob = emptyMob();
      if (Number(DOM.filterWorld?.value || 0) > 0) STATE.mob.WorldID = Number(DOM.filterWorld.value);
      if (Number(DOM.filterMob?.value || 0) > 0) STATE.mob.BotID = Number(DOM.filterMob.value);
      STATE.persistedMob = null;
      DIRTY?.setClean();
      renderList();
      renderForm();
      setHeader();
      STATE.activeTab = 'basic';
      renderTabs();
      STATE._closeDrawer?.();
    };

    const saveMob = async () => {
      if (!STATE.mob) return;
      if (!Number(STATE.mob.BotID || 0)) {
        window.EditorCore.UI.toast('BotID is required', 'warning');
        return;
      }
      const payload = toPayload(STATE.mob);

      try {
        if (STATE.selectedId) {
          await window.EditorCore.DBCrud.update(RESOURCE, STATE.selectedId, payload);
          window.EditorCore.UI.toast('Saved', 'success');
        } else {
          const created = await window.EditorCore.DBCrud.create(RESOURCE, payload);
          window.EditorCore.UI.toast('Created', 'success');
          const newId = Number(created?.id || 0);
          STATE.lastSelectedIdBeforeCreate = 0;
          await loadList({ reset: true });
          if (newId) await selectMob(newId);
        }
        // refresh list (keep selected)
        await loadList({ reset: true });
        if (STATE.selectedId) {
          // ensure selected still exists and update title preview
          const cur = STATE.list.find(x => Number(x.ID) === Number(STATE.selectedId));
          if (cur) {
            // keep
          }
        }
        setHeader();
        DIRTY?.setClean();
      } catch (e) {
        window.EditorCore.UI.toast(e.message || 'Save failed', 'error');
      }
    };

    const deleteMob = async () => {
      if (!STATE.selectedId) return;
      const ok = await EditorCore.Page.confirm(`Delete the record ID=${STATE.selectedId}?`);
      if (!ok) return;
      try {
        await window.EditorCore.DBCrud.remove(RESOURCE, STATE.selectedId);
        window.EditorCore.UI.toast('Deleted', 'success');
        STATE.selectedId = 0;
        STATE.mob = null;
        DIRTY?.setClean();
        renderForm();
        setHeader();
        await loadList({ reset: true });
      } catch (e) {
        window.EditorCore.UI.toast(e.message || 'Delete failed', 'error');
      }
    };

    const cancelMobChanges = async () => {
      if (!STATE.mob || !DIRTY?.isDirty?.()) return;
      if (!STATE.selectedId) {
        const fallbackId = Number(STATE.lastSelectedIdBeforeCreate || 0);
        if (fallbackId > 0) await selectMob(fallbackId);
        else {
          STATE.mob = null;
          STATE.selectedId = 0;
          STATE.persistedMob = null;
          DIRTY?.setClean();
          renderForm();
          setHeader();
          renderList();
        }
        return;
      }
      STATE.mob = cloneData(STATE.persistedMob || STATE.mob);
      DIRTY?.setClean();
      renderForm();
      setHeader();
    };

    const debounce = EditorCore.Page.debounce;

    let STATE = {
      list: [],
      offset: 0,
      hasMore: true,
      selectedId: 0,
      lastSelectedIdBeforeCreate: 0,
      mob: null,
      persistedMob: null,
      activeTab: 'basic',
      lookups: { bots: new Map(), worlds: new Map(), botSkins: new Map() },
      skinsApi: '',
      defaults: { firstItemId: 0 },
      _closeDrawer: () => {},
    };

    const init = async () => {
      window.EditorCoreBootstrap = window.EditorCoreBootstrap || window.EditorCore.bootstrapEditor({ mode: 'scenario' });

      // Initialize sidebar db selects
      window.EditorCore.UIManager.init(DOM.sidebar);

      renderTabs();

      await showDbStatus();
      await loadLookups();

      await loadDefaults();

      // Initial list
      await loadList({ reset: true });
      if (!STATE.mob && STATE.list.length) {
        await selectMob(STATE.list[0].ID, { confirmDirty: false });
      } else {
        renderForm();
        setHeader();
      }

      window.addEventListener('message', (event) => {
        if (!window.EditorCore?.Http?.isSameOriginMessage?.(event, window.parent)) return;
        const data = event.data || {};
        if (data?.type !== 'editor-shell:request-dirty-status') return;
        window.EditorCore.Http.postMessage(window.parent, {
          type: 'editor-shell:dirty-status',
          requestId: data.requestId,
          dirty: !!DIRTY?.isDirty?.(),
        });
      });

      DOM.refresh.addEventListener('click', async () => {
        await loadLookups();

      await loadDefaults();
        await loadList({ reset: true });
      });

      DOM.more.addEventListener('click', () => loadList({ reset: false }));
      DOM.newBtn.addEventListener('click', newMob);
      DOM.save.addEventListener('click', saveMob);
      DOM.cancel.addEventListener('click', cancelMobChanges);
      DOM.del.addEventListener('click', deleteMob);

      DOM.search.addEventListener('input', debounce(() => {
        renderList();
        // If numeric, refetch server-side
        if (isNumericSearch(DOM.search.value || '')) loadList({ reset: true });
      }, 180));

      DOM.filterMob.addEventListener('change', () => renderList());
      DOM.filterWorld.addEventListener('change', () => renderList());
      DOM.filterBoss?.addEventListener('change', () => renderList());

      STATE._closeDrawer = () => {};
    };

    init();
  </script>
</body>
</html>
