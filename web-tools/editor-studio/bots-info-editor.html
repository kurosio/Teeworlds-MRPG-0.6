<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bots • Editor Studio</title>
  <script src="editor-core/page-loader.js" data-mode="event"></script>

  <style>
    .skin-preview-frame{
      background: var(--editor-surface);
      border: 1px solid var(--editor-border);
    }
    .skin-preview-frame img{
      image-rendering: pixelated;
    }
  </style>
</head>

<body class="editor-theme" data-editor="bots_info">
  <div class="editor-page">
    <div class="editor-page-header">
      <div class="editor-page-title">
        <i class="fa-solid fa-robot text-accent text-xl"></i>
        <div>
          <h1>Bots</h1>
          <div class="editor-page-sub">Mob profile: name, skin and equipment.</div>
        </div>
      </div>
      <div class="editor-page-actions">
        <button class="editor-btn editor-btn-secondary" data-editor-role="refresh">
          <i class="fa-solid fa-rotate"></i><span>Refresh</span>
        </button>
        <button class="editor-btn editor-btn-primary" data-editor-role="new">
          <i class="fa-solid fa-plus"></i><span>New bot</span>
        </button>
      </div>
    </div>

    <div class="editor-shell editor-shell--docked">
      <aside class="editor-sidebar editor-dock-sidebar">
        <div class="editor-dock-pad">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold">Bot list</div>
              <div class="text-xs editor-muted-text">Total: <span data-editor-role="count">—</span></div>
            </div>
          </div>

          <div class="mt-3">
            <div class="editor-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input data-editor-role="search" type="search" class="w-full editor-input form-input" placeholder="Search by ID/name…" />
            </div>
          </div>

          <div class="mt-4 editor-sidebar-list editor-scroll" data-editor-role="list"></div>
        </div>
      </aside>

      <section class="editor-main editor-dock-main">
        <div class="editor-dock-pad">
          <div class="editor-sticky-toolbar flex items-start justify-between gap-4">
            <div>
              <div class="text-lg font-semibold" data-editor-role="title">Select a bot</div>
              <div class="editor-muted-text text-sm mt-1" data-editor-role="subtitle">or create a new one</div>
            </div>
            <div class="editor-page-actions">
              <span id="dirty-pill" class="editor-dirty-pill hidden">Data not saved</span>
              <button class="editor-btn editor-btn-primary" data-editor-role="save" disabled>
                <i class="fa-solid fa-floppy-disk"></i><span>Save</span>
              </button>
              <button class="editor-btn editor-btn-secondary hidden" data-editor-role="cancel" disabled>
                <i class="fa-solid fa-rotate-left"></i><span>Cancel</span>
              </button>
              <button class="editor-btn editor-btn-secondary" data-editor-role="delete" disabled>
                <i class="fa-solid fa-trash"></i><span>Delete</span>
              </button>
            </div>
          </div>

          <div class="editor-section mt-4">
            <div class="editor-panel-card">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div class="font-semibold">Bot profile</div>
                  <div class="editor-muted-text text-sm">Name, skin appearance and equipped gear.</div>
                </div>
                <div id="tabRoot"></div>
              </div>

              <div class="mt-4">
                <div id="tab_basic" class="space-y-6">
                  <div class="grid gap-4 md:grid-cols-[220px,1fr] items-start">
                    <div class="editor-panel-card flex flex-col items-center gap-3">
                      <div class="text-xs uppercase tracking-wider editor-muted-text">Skin preview</div>
                      <div class="skin-preview-frame w-36 h-36 rounded-2xl flex items-center justify-center">
                        <img id="skinPreviewImg" class="w-28 h-28" alt="Skin preview" />
                      </div>
                      <div id="skinPreviewMeta" class="text-xs editor-muted-text text-center">Skin not loaded</div>
                    </div>
                    <div class="space-y-4">
                      <div id="formBasic"></div>
                      <div class="editor-form-grid-2" id="formSkin"></div>
                    </div>
                  </div>
                </div>

                <div id="tab_gear" class="space-y-6 hidden">
                  <div class="editor-form-grid-2" id="formGear"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-4" data-editor-role="status"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const { fieldRenderOptions } = window.EditorCoreBootstrap || EditorCore.bootstrapEditor({ mode: 'event' });

    const DOM = {
      list: document.querySelector('[data-editor-role="list"]'),
      search: document.querySelector('[data-editor-role="search"]'),
      refresh: document.querySelector('[data-editor-role="refresh"]'),
      newBtn: document.querySelector('[data-editor-role="new"]'),
      title: document.querySelector('[data-editor-role="title"]'),
      subtitle: document.querySelector('[data-editor-role="subtitle"]'),
      save: document.querySelector('[data-editor-role="save"]'),
      cancel: document.querySelector('[data-editor-role="cancel"]'),
      del: document.querySelector('[data-editor-role="delete"]'),
      status: document.querySelector('[data-editor-role="status"]'),
      count: document.querySelector('[data-editor-role="count"]'),
      tabRoot: document.getElementById('tabRoot'),
      tabBasic: document.getElementById('tab_basic'),
      tabGear: document.getElementById('tab_gear'),
      formBasic: document.getElementById('formBasic'),
      formSkin: document.getElementById('formSkin'),
      formGear: document.getElementById('formGear'),
      skinPreviewImg: document.getElementById('skinPreviewImg'),
      skinPreviewMeta: document.getElementById('skinPreviewMeta')
    };

    const dirty = EditorCore.Dirty?.create
      ? EditorCore.Dirty.create({
          root: document.querySelector('.editor-main') || document.body,
          pill: document.getElementById('dirty-pill'),
          beforeUnload: true,
        })
      : { markDirty: () => {}, setClean: () => {} };

    const STATE = {
      rows: [],
      selectedId: 0,
      lastSelectedIdBeforeCreate: 0,
      model: null,
      persistedModel: null,
      skinsApi: '',
      forms: {
        basic: null,
        skin: null,
        gear: null,
      }
    };

    const cloneData = EditorCore.utils.cloneData;

    const BASIC_FIELDS = {
      Name: {
        type: 'text',
        label: 'Bot name',
        validate: { required: true },
        ui: { placeholder: 'e.g. Guardian' }
      }
    };

    const SKIN_FIELDS = {
      'Skin.name': {
        type: 'text',
        label: 'Skin name',
        ui: { placeholder: 'default' }
      },
      'Skin.custom_color': {
        type: 'toggle',
        label: 'Custom colours'
      },
      'Skin.color_body': {
        type: 'number',
        label: 'Body colour',
        ui: { min: 0, step: 1, placeholder: '0' },
        help: 'Used only when “Custom colours” is checked. '
      },
      'Skin.color_feet': {
        type: 'number',
        label: 'Feet colour',
        ui: { min: 0, step: 1, placeholder: '0' },
        help: 'Used only when “Custom colours” is checked. '
      }
    };

    const GEAR_FIELDS = {
      EquippedModules: {
        type: 'text',
        label: 'Modules',
        ui: { placeholder: '90,91,35' },
        help: 'Module IDs separated by commas. Leave 0 if there are no modules.'
      },
      SlotHammer: {
        type: 'db_select',
        label: 'Hammer',
        ui: {
          dbKey: 'item',
          placeholder: '— item —',
          searchPlaceholder: 'Search an item…',
          valueType: 'number',
          dbFilter: { key: 'Type', value: 'Equip hammer' }
        }
      },
      SlotGun: {
        type: 'db_select',
        label: 'Pistol',
        ui: {
          dbKey: 'item',
          placeholder: '— item —',
          searchPlaceholder: 'Search an item…',
          valueType: 'number',
          dbFilter: { key: 'Type', value: 'Equip gun' }
        }
      },
      SlotShotgun: {
        type: 'db_select',
        label: 'Shotgun',
        ui: {
          dbKey: 'item',
          placeholder: '— item —',
          searchPlaceholder: 'Search an item…',
          valueType: 'number',
          dbFilter: { key: 'Type', value: 'Equip shotgun' }
        }
      },
      SlotGrenade: {
        type: 'db_select',
        label: 'Grenade launcher',
        ui: {
          dbKey: 'item',
          placeholder: '— item —',
          searchPlaceholder: 'Search an item…',
          valueType: 'number',
          dbFilter: { key: 'Type', value: 'Equip grenade' }
        }
      },
      SlotRifle: {
        type: 'db_select',
        label: 'Laser',
        ui: {
          dbKey: 'item',
          placeholder: '— item —',
          searchPlaceholder: 'Search an item…',
          valueType: 'number',
          dbFilter: { key: 'Type', value: 'Equip rifle' }
        }
      },
      SlotArmor: {
        type: 'db_select',
        label: 'Armour',
        ui: {
          dbKey: 'item',
          placeholder: '— item —',
          searchPlaceholder: 'Search an item…',
          valueType: 'number',
          dbFilter: { key: 'Type', values: ['Equip armor (tank)', 'Equip armor (dps)', 'Equip armor (healer)'] }
        }
      }
    };

    const emptyModel = () => ({
      ID: 0,
      Name: '',
      JsonTeeInfo: '',
      EquippedModules: '0',
      SlotHammer: 0,
      SlotGun: 0,
      SlotShotgun: 0,
      SlotGrenade: 0,
      SlotRifle: 0,
      SlotArmor: 0,
      Skin: {
        name: 'default',
        custom_color: 0,
        color_body: 0,
        color_feet: 0,
      }
    });

    const parseTeeInfo = (raw) => {
      if (!raw) return { name: 'default', custom_color: 0, color_body: 0, color_feet: 0 };
      try {
        const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (!data || typeof data !== 'object') throw new Error('bad');
        const name = data.skin || 'default';
        const custom = Number(data.custom_color ?? data.customColor ?? 0);
        const body = Number(data.color_body ?? data.colorBody ?? 0);
        const feet = Number(data.color_feet ?? data.color_feer ?? data.colorFeet ?? 0);
        return {
          name,
          custom_color: Number.isFinite(custom) && custom ? 1 : 0,
          color_body: Number.isFinite(body) ? body : 0,
          color_feet: Number.isFinite(feet) ? feet : 0,
        };
      } catch {
        return { name: 'default', custom_color: 0, color_body: 0, color_feet: 0 };
      }
    };

    const normalizeSlot = (value) => {
      const num = Number(value || 0);
      if (!Number.isFinite(num) || num <= 0) return null;
      return num;
    };

    const toModel = (row) => ({
      ID: Number(row?.ID || 0),
      Name: row?.Name || '',
      JsonTeeInfo: row?.JsonTeeInfo || '',
      EquippedModules: row?.EquippedModules || '0',
      SlotHammer: row?.SlotHammer ?? 0,
      SlotGun: row?.SlotGun ?? 0,
      SlotShotgun: row?.SlotShotgun ?? 0,
      SlotGrenade: row?.SlotGrenade ?? 0,
      SlotRifle: row?.SlotRifle ?? 0,
      SlotArmor: row?.SlotArmor ?? 0,
      Skin: parseTeeInfo(row?.JsonTeeInfo),
    });

    const toPayload = (model) => {
      const skin = model?.Skin || {};
      const custom = skin.custom_color ? 1 : 0;
      const payloadSkin = {
        skin: String(skin.name || 'default'),
        custom_color: custom,
        color_body: custom ? Number(skin.color_body || 0) : 0,
        color_feet: custom ? Number(skin.color_feet || 0) : 0,
      };
      return {
        Name: String(model?.Name || '').trim() || 'Bot name',
        JsonTeeInfo: JSON.stringify(payloadSkin),
        EquippedModules: String(model?.EquippedModules || '0').trim() || '0',
        SlotHammer: normalizeSlot(model?.SlotHammer),
        SlotGun: normalizeSlot(model?.SlotGun),
        SlotShotgun: normalizeSlot(model?.SlotShotgun),
        SlotGrenade: normalizeSlot(model?.SlotGrenade),
        SlotRifle: normalizeSlot(model?.SlotRifle),
        SlotArmor: normalizeSlot(model?.SlotArmor),
      };
    };

    const setStatus = (message = '', tone = 'muted') =>
      EditorCore.utils.setStatus(DOM.status, message, tone, { className: '' });

    const setButtons = (enabled) => {
      const canCancel = enabled && !!dirty.isDirty?.();
      if (DOM.save) DOM.save.disabled = !enabled;
      if (DOM.cancel) {
        DOM.cancel.disabled = !canCancel;
        DOM.cancel.classList.toggle('hidden', !canCancel);
      }
      if (DOM.del) DOM.del.disabled = !enabled || !STATE.selectedId;
    };

    const esc = EditorCore.Page.esc;
    const canDiscardDirty = async () => {
      if (!dirty?.isDirty?.()) return true;
      return EditorCore.Page.confirm('You have unsaved changes. Continue without saving?');
    };

    const setHeader = () => {
      if (!DOM.title && !DOM.subtitle) return;
      if (!STATE.model) {
        if (DOM.title) DOM.title.textContent = 'Select a bot';
        if (DOM.subtitle) DOM.subtitle.textContent = 'or create a new one';
        return;
      }
      const name = STATE.model?.Name || (STATE.selectedId ? `Bot #${STATE.selectedId}` : 'New bot');
      if (DOM.title) DOM.title.textContent = name;
      if (DOM.subtitle) DOM.subtitle.textContent = STATE.selectedId ? `ID ${STATE.selectedId}` : 'New record';
    };

    const updateSkinControls = () => {
      const custom = !!STATE.model?.Skin?.custom_color;
      const toggleState = custom ? '1' : '0';
      const toggle = DOM.formSkin?.querySelector?.('[data-path="Skin.custom_color"]');
      if (toggle?.closest('.editor-toggle')) {
        toggle.closest('.editor-toggle').setAttribute('data-checked', toggleState);
      }
      DOM.formSkin?.querySelectorAll?.('[data-path="Skin.color_body"], [data-path="Skin.color_feet"]').forEach((el) => {
        el.disabled = !custom;
      });
    };

    const updatePreview = () => {
      if (!DOM.skinPreviewImg || !DOM.skinPreviewMeta) return;
      const skin = STATE.model?.Skin || {};
      const hasApi = !!STATE.skinsApi;
      if (!STATE.model) {
        DOM.skinPreviewImg.src = '';
        DOM.skinPreviewImg.classList.add('hidden');
        DOM.skinPreviewMeta.textContent = 'No skin selected.';
        return;
      }
      if (!hasApi) {
        DOM.skinPreviewImg.src = '';
        DOM.skinPreviewImg.classList.add('hidden');
        DOM.skinPreviewMeta.textContent = 'The skin preview service is not configured.';
        return;
      }
      const url = EditorCore.utils.renderSkinApiUrl(STATE.skinsApi, {
        name: skin.name,
        body: skin.custom_color ? skin.color_body : '',
        foot: skin.custom_color ? skin.color_feet : '',
      });
      DOM.skinPreviewImg.src = url;
      DOM.skinPreviewImg.classList.toggle('hidden', !url);
      DOM.skinPreviewMeta.textContent = `${skin.name || 'default'} · ${skin.custom_color ? 'custom color' : 'standard'}`;
    };

    const showEmptyForm = () => {
      const emptyHtml = '<div class="editor-empty-state editor-field--span-all">Select a bot in the list on the left or click “New bot”.</div>';
      DOM.formBasic.innerHTML = emptyHtml;
      DOM.formSkin.innerHTML = '';
      DOM.formGear.innerHTML = emptyHtml;
      updatePreview();
    };

    const mountForms = () => {
      if (!STATE.model) {
        showEmptyForm();
        STATE.forms.basic = null;
        STATE.forms.skin = null;
        STATE.forms.gear = null;
        return;
      }

      const onChange = (data, meta) => {
        STATE.model = data;
        dirty.markDirty();
        setButtons(true);
        if (meta?.path?.startsWith('Skin.')) {
          updateSkinControls();
          updatePreview();
        }
      };

      if (!STATE.forms.basic) {
        STATE.forms.basic = EditorCore.FormRuntime.mount(DOM.formBasic, {
          fields: BASIC_FIELDS,
          data: STATE.model,
          fieldOptions: fieldRenderOptions,
          onChange,
        });
      } else {
        STATE.forms.basic.setData(STATE.model);
      }

      if (!STATE.forms.skin) {
        STATE.forms.skin = EditorCore.FormRuntime.mount(DOM.formSkin, {
          fields: SKIN_FIELDS,
          data: STATE.model,
          fieldOptions: fieldRenderOptions,
          onChange,
        });
      } else {
        STATE.forms.skin.setData(STATE.model);
      }

      if (!STATE.forms.gear) {
        STATE.forms.gear = EditorCore.FormRuntime.mount(DOM.formGear, {
          fields: GEAR_FIELDS,
          data: STATE.model,
          fieldOptions: fieldRenderOptions,
          onChange,
        });
      } else {
        STATE.forms.gear.setData(STATE.model);
      }

      updateSkinControls();
      updatePreview();
    };

    const renderList = () => {
      const rows = STATE.rows || [];
      if (DOM.count) DOM.count.textContent = rows.length ? `${rows.length}` : '0';
      if (!DOM.list) return;
      if (!rows.length) {
        DOM.list.innerHTML = '<div class="editor-empty-state">No bots found — change the search or click “New bot”.</div>';
        return;
      }
      const skinsApi = STATE.skinsApi || '';
      const html = rows.map((row) => {
        const active = Number(row?.ID) === Number(STATE.selectedId);
        const skin = parseTeeInfo(row?.JsonTeeInfo);
        const skinUrl = skinsApi
          ? EditorCore.utils.renderSkinApiUrl(skinsApi, {
              name: skin.name,
              body: skin.custom_color ? skin.color_body : '',
              foot: skin.custom_color ? skin.color_feet : '',
            })
          : '';
        const skinPreview = skinUrl
          ? `<img class="w-9 h-9 rounded-full border editor-hairline object-cover shrink-0" src="${esc(skinUrl)}" alt="" loading="lazy" />`
          : `<div class="w-9 h-9 rounded-full border editor-hairline editor-soft shrink-0 flex items-center justify-center text-[10px] editor-muted-text">—</div>`;
        return `
          <button type="button" class="w-full text-left editor-row ${active ? 'editor-row-active' : ''}" data-id="${esc(row?.ID)}">
            <div class="flex items-center gap-3">
              ${skinPreview}
              <div class="min-w-0">
                <div class="font-semibold truncate">${esc(row?.Name || `#${row?.ID}`)}</div>
                <div class="text-xs editor-muted-text truncate">ID ${esc(row?.ID)} · ${esc(skin.name || 'default')}</div>
              </div>
            </div>
          </button>
        `;
      }).join('');
      DOM.list.innerHTML = `<div class="editor-list">${html}</div>`;
    };

    const selectRow = async (row, { confirmDirty = false } = {}) => {
      if (row && Number(row.ID || 0) === Number(STATE.selectedId) && STATE.model && confirmDirty) return;
      if (confirmDirty && !await canDiscardDirty()) return;
      if (!row) {
        STATE.selectedId = 0;
        STATE.model = null;
        STATE.persistedModel = null;
        dirty.setClean();
        mountForms();
        renderList();
        setHeader();
        setButtons(false);
        return;
      }
      STATE.selectedId = Number(row.ID || 0);
      STATE.model = toModel(row);
      STATE.persistedModel = cloneData(STATE.model);
      dirty.setClean();
      mountForms();
      renderList();
      setHeader();
      setButtons(true);
    };

    const loadList = async () => {
      const search = DOM.search?.value?.trim() || '';
      setStatus('Loading list…');
      try {
        const res = await EditorCore.DBCrud.list('bots_info', { search, limit: 5000, offset: 0 });
        STATE.rows = Array.isArray(res.rows) ? res.rows : [];
        setStatus(STATE.rows.length ? '' : 'The list is empty.', 'muted');
        renderList();
        if (STATE.selectedId) {
          const found = STATE.rows.find(r => Number(r.ID) === Number(STATE.selectedId));
          if (found) selectRow(found);
        } else if (!STATE.model && STATE.rows.length) {
          selectRow(STATE.rows[0]);
        }
      } catch (err) {
        const msg = err?.message || 'Loading failed';
        setStatus(msg, 'err');
        EditorCore.UI.toast(msg, 'error');
      }
    };

    const createNew = async () => {
      if (!await canDiscardDirty()) return;
      STATE.lastSelectedIdBeforeCreate = Number(STATE.selectedId || 0);
      STATE.selectedId = 0;
      STATE.model = emptyModel();
      STATE.persistedModel = null;
      dirty.setClean();
      mountForms();
      renderList();
      setHeader();
      setButtons(true);
    };

    const cancelLocalChanges = () => {
      if (!STATE.model || !dirty.isDirty?.()) return;
      if (!STATE.selectedId) {
        const fallbackId = Number(STATE.lastSelectedIdBeforeCreate || 0);
        const fallbackRow = fallbackId
          ? STATE.rows.find((row) => Number(row?.ID || 0) === fallbackId)
          : null;
        if (fallbackRow) selectRow(fallbackRow);
        else selectRow(null);
        setStatus('Record creation cancelled.', 'ok');
        return;
      }
      STATE.model = cloneData(STATE.persistedModel || STATE.model);
      dirty.setClean();
      mountForms();
      renderList();
      setHeader();
      setButtons(true);
      setStatus('Local changes discarded.', 'ok');
    };

    const save = async () => {
      if (!STATE.model) return;
      setStatus('Saving…');
      try {
        const payload = toPayload(STATE.model);
        if (STATE.selectedId) {
          await EditorCore.DBCrud.update('bots_info', STATE.selectedId, payload);
          setStatus('Changes saved.', 'ok');
          EditorCore.UI.toast('Saved', 'success');
        } else {
          const res = await EditorCore.DBCrud.create('bots_info', payload);
          STATE.selectedId = Number(res.id || 0);
          STATE.lastSelectedIdBeforeCreate = 0;
          setStatus('Record created.', 'ok');
          EditorCore.UI.toast('Created', 'success');
        }
        dirty.setClean();
        await loadList();
      } catch (err) {
        const msg = err?.message || 'Save failed';
        setStatus(msg, 'err');
        EditorCore.UI.toast(msg, 'error');
      }
    };

    const remove = async () => {
      if (!STATE.selectedId) return;
      if (!await EditorCore.Page.confirm('Delete the record?')) return;
      setStatus('Deleting…');
      try {
        await EditorCore.DBCrud.remove('bots_info', STATE.selectedId);
        EditorCore.UI.toast('Deleted', 'success');
        setStatus('Deleted.', 'ok');
        selectRow(null);
        await loadList();
      } catch (err) {
        const msg = err?.message || 'Delete failed';
        setStatus(msg, 'err');
        EditorCore.UI.toast(msg, 'error');
      }
    };

    const tabs = EditorCore.UI.mountTabs(DOM.tabRoot, {
      tabs: [
        { id: 'basic', title: 'Name & skin', icon: 'fa-user-astronaut' },
        { id: 'gear', title: 'Equipment', icon: 'fa-shield-halved' },
      ],
      active: 'basic',
      onChange: (id) => {
        DOM.tabBasic.classList.toggle('hidden', id !== 'basic');
        DOM.tabGear.classList.toggle('hidden', id !== 'gear');
      }
    });

    if (tabs?.getActive) {
      const active = tabs.getActive();
      DOM.tabBasic.classList.toggle('hidden', active !== 'basic');
      DOM.tabGear.classList.toggle('hidden', active !== 'gear');
    }

    DOM.list?.addEventListener('click', (event) => {
      const btn = event.target?.closest?.('[data-id]');
      if (!btn) return;
      const id = Number(btn.getAttribute('data-id') || 0);
      const row = STATE.rows.find(r => Number(r.ID) === id);
      if (row) selectRow(row, { confirmDirty: true });
    });

    window.addEventListener('message', (event) => {
      if (!window.EditorCore?.Http?.isSameOriginMessage?.(event, window.parent)) return;
      const data = event.data || {};
      if (data?.type !== 'editor-shell:request-dirty-status') return;
      window.EditorCore.Http.postMessage(window.parent, {
        type: 'editor-shell:dirty-status',
        requestId: data.requestId,
        dirty: !!dirty?.isDirty?.(),
      });
    });

    DOM.refresh?.addEventListener('click', loadList);
    DOM.newBtn?.addEventListener('click', createNew);
    DOM.save?.addEventListener('click', save);
    DOM.cancel?.addEventListener('click', cancelLocalChanges);
    DOM.del?.addEventListener('click', remove);

    if (DOM.search) {
      DOM.search.addEventListener('input', EditorCore.utils.debounce(loadList, 250));
    }

    const init = async () => {
      STATE.skinsApi = await EditorCore.utils.getSkinsApi();
      loadList();
      setHeader();
    };

    init();
  </script>
