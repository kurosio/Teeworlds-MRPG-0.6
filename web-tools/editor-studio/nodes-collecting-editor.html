<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collecting nodes • Editor Studio</title>
  <script src="editor-core/page-loader.js" data-mode="event"></script>
</head>

<body class="editor-theme" data-editor="nodes_collecting">
  <div class="editor-page">
    <div class="editor-page-header">
      <div class="editor-page-title">
        <i class="fa-solid fa-seedling text-accent text-xl"></i>
        <div>
          <h1>Collecting nodes</h1>
          <div class="editor-page-sub">Ore, plants and fish: drops and map switch bindings.</div>
        </div>
      </div>
      <div class="editor-page-actions">
        <button class="editor-btn editor-btn-secondary" data-editor-role="refresh">
          <i class="fa-solid fa-rotate"></i><span>Refresh</span>
        </button>
        <button class="editor-btn editor-btn-primary" data-editor-role="new">
          <i class="fa-solid fa-plus"></i><span>New node</span>
        </button>
      </div>
    </div>

    <div class="editor-shell editor-shell--docked">
      <!-- Sidebar -->
      <aside class="editor-sidebar editor-dock-sidebar">
        <div class="editor-dock-pad">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-semibold">Collecting nodes</div>
              <div class="text-xs editor-muted-text">Total: <span data-editor-role="count">—</span></div>
            </div>
          </div>

          <div class="mt-3">
            <div class="editor-search">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input data-editor-role="search" type="search" class="w-full editor-input form-input" placeholder="Search by ID, name, switch…" />
            </div>
          </div>

          <div class="mt-3 editor-sidebar-filters">
            <select id="filterWorld" class="w-full editor-input form-input" data-datasource="worlds" data-label-mode="id_name" data-db-searchable="0" data-db-limit="300" data-value-type="number">
              <option value="">All worlds</option>
            </select>
          </div>

          <div class="mt-3">
            <select id="filterType" class="w-full editor-input form-input" aria-label="Resource type">
              <option value="">All types</option><option value="ore">Ore</option><option value="plant">Plants</option><option value="fish">Fish</option>
            </select>
          </div>
          <div class="mt-4 editor-sidebar-list editor-scroll" data-editor-role="list"></div>
        </div>
      </aside>

      <!-- Main -->
      <section class="editor-main editor-dock-main">
        <div class="editor-dock-pad">
          <div class="editor-sticky-toolbar flex items-start justify-between gap-4">
            <div>
              <div class="text-lg font-semibold" data-editor-role="title">Select a node</div>
              <div class="editor-muted-text text-sm mt-1" data-editor-role="subtitle">or create a new one</div>
            </div>
            <div class="editor-page-actions">
              <span id="dirty-pill" class="editor-dirty-pill hidden">Data not saved</span>
              <button class="editor-btn editor-btn-primary" data-editor-role="save" disabled>
                <i class="fa-solid fa-floppy-disk"></i><span>Save</span>
              </button>
              <button class="editor-btn editor-btn-secondary hidden" data-editor-role="cancel" disabled>
                <i class="fa-solid fa-rotate-left"></i><span>Cancel</span>
              </button>
              <button class="editor-btn editor-btn-secondary" data-editor-role="delete" disabled>
                <i class="fa-solid fa-trash"></i><span>Delete</span>
              </button>
            </div>
          </div>

          <div class="editor-section mt-4">
            <button id="previewNode" class="editor-btn editor-btn-secondary">Preview linked nodes on map</button>
          </div>
          <div class="editor-section mt-4">
            <div class="editor-form-grid-2" data-editor-role="form"></div>
          </div>

          <div class="mt-4" data-editor-role="status"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="editor-core/collecting-properties.js"></script>
  <script>
    const { fieldRenderOptions } = window.EditorCoreBootstrap || EditorCore.bootstrapEditor({ mode: 'event' });
    const codec = EditorCore.CollectingProperties;
    const worldFilter = document.getElementById('filterWorld');
    const typeFilter = document.getElementById('filterType');
    const fields = {
      Name: { type: 'text', label: 'Name', validate: { required: true }, ui: { placeholder: 'Stone / Coal', spanAll: true } },
      WorldID: { type: 'db_select', label: 'World', ui: { datasource: 'worlds', labelMode: 'id_name', searchPlaceholder: 'Search a world…' } },
      Type: { type: 'text', label: 'Resource type', ui: { type: 'select', options: [
        { value: 'ore', label: 'Ore' }, { value: 'plant', label: 'Plants' }, { value: 'fish', label: 'Fish' }
      ] } },
      SwitchID: { type: 'number', label: 'Map switch number', ui: { min: 1, max: 255, step: 1 } },
      Level: { type: 'number', label: 'Profession level', ui: { min: 1, step: 1 } },
      Health: { type: 'number', label: 'Health', ui: { min: 1, step: 1 } },
      Items: {
        type: 'list', label: 'Drops: item, quantity and chance',
        ui: { spanAll: true, addLabel: 'Add item', listMode: 'table',
          tableHeader: ['Item', 'Quantity', 'Chance / weight (%)'],
          tableCols: 'minmax(0,1fr) 120px 140px', tableColsMd: 'minmax(0,1fr) 140px 160px',
          emptyMessage: 'Add items that can be collected from this node.' },
        itemDefault: { item_id: 0, amount: 1, chance: 100 },
        itemFields: {
          item_id: { type: 'db_select', label: 'Item', ui: { dbKey: 'item', placeholder: '— item —', searchPlaceholder: 'Search an item…', searchServer: true, dbLimit: 1000 } },
          amount: { type: 'number', label: 'Quantity (0 = 1–2)', ui: { min: 0, max: 1000000, step: 1 } },
          chance: { type: 'number', label: 'Chance / weight (%)', ui: { min: 0.000001, max: 100, step: 0.0001 } },
        }
      }
    };
    let hasChanges = false;
    const setDirty = value => {
      hasChanges = value;
      document.getElementById('dirty-pill').classList.toggle('hidden', !value);
    };
    const dirty = { markDirty: () => setDirty(true), setClean: () => setDirty(false), isDirty: () => hasChanges };
    EditorCore.Page.guardUnsaved(dirty.isDirty);
    const editor = EditorCore.DbEditor.mount(document.body, {
      resource: 'nodes_collecting', fields, fieldOptions: fieldRenderOptions, dirty,
      defaults: () => ({ Name: '', WorldID: worldFilter.value === '' ? 0 : Number(worldFilter.value), Type: typeFilter.value || 'ore', SwitchID: 1, Level: 1, Health: 3, Items: [] }),
      rowToModel: row => ({ Name: String(row.Name || ''), WorldID: Number(row.WorldID), Type: row.Type,
        SwitchID: Number(row.SwitchID), Level: Number(row.Level), Health: Number(row.Health), Items: codec.parse(row.Properties) }),
      modelToPayload: model => ({ Name: model.Name.trim(), WorldID: Number(model.WorldID), Type: model.Type,
        SwitchID: Number(model.SwitchID), Level: Number(model.Level), Health: Number(model.Health), Properties: codec.serialize(model.Items) }),
      validateModel: model => {
        if (!model.Name.trim() || model.Name.trim().length > 128) return 'Enter a name (up to 128 characters).';
        if (!Object.hasOwn(codec.tiles, model.Type)) return 'Choose a resource type.';
        if (model.WorldID === '' || !Number.isInteger(Number(model.WorldID)) || Number(model.WorldID) < 0) return 'Choose a world.';
        if (!Number.isInteger(Number(model.SwitchID)) || Number(model.SwitchID) < 1 || Number(model.SwitchID) > 255) return 'Switch number must be between 1 and 255.';
        if (['Level', 'Health'].some(key => !Number.isInteger(Number(model[key])) || Number(model[key]) < 1 || Number(model[key]) > 2147483647)) return 'Level and health must be positive integers.';
        return codec.validate(model.Items);
      },
      transformList: rows => rows.filter(row => (worldFilter.value === '' || Number(row.WorldID) === Number(worldFilter.value)) && (!typeFilter.value || row.Type === typeFilter.value)),
      listItem: row => ({ icon: ({ fish: 'fa-fish', ore: 'fa-gem', plant: 'fa-seedling' })[row.Type] || 'fa-seedling', title: row.Name, subtitle: `#${row.ID} · ${row.Type} · World ${row.WorldID} · switch ${row.SwitchID} · Lv. ${row.Level}` }),
      getTitle: (model, id) => id ? model.Name : 'New collecting node',
      getSubtitle: model => `${model.Type} · World ${model.WorldID} · switch ${model.SwitchID}`,
      emptyTitle: 'Select a collecting node', emptySubtitle: 'or create a new one',
    });
    worldFilter.addEventListener('change', () => editor.refresh());
    typeFilter.addEventListener('change', () => editor.refresh());
    document.getElementById('previewNode').addEventListener('click', () => {
      const model = editor.getModel();
      if (!model) return EditorCore.UI.toast('Select or create a node first.', 'info');
      if (model.WorldID === '' || !Number.isInteger(Number(model.WorldID)) || Number(model.WorldID) < 0 || !Object.hasOwn(codec.tiles, model.Type)
        || !Number.isInteger(Number(model.SwitchID)) || Number(model.SwitchID) < 1 || Number(model.SwitchID) > 255) {
        return EditorCore.UI.toast('Choose a world, resource type and switch number (1–255).', 'error');
      }
      EditorCore.PointMap.preview({ worldId: Number(model.WorldID), highlightTiles: [codec.tiles[model.Type]], switchShowID: Number(model.SwitchID) });
    });

  </script>
</body>
</html>
