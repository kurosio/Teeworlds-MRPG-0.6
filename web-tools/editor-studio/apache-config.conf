# Apache Configuration for Editor Studio — единый конфиг и для Docker-образа
# (Dockerfile делает COPY apache-config.conf в sites-available), и для production:
# либо через build context, либо смонтированным томом поверх sites-available.
#
# Что делает конфиг (отличия от «минимальной» версии):
#   1. mod_rewrite-алиасы для AI-обнаружения: /.well-known/ai-plugin.json,
#      /openapi.json, /mcp — ведут на те же PHP-эндпоинты, что в репозитории
#      (api/ai.php?action=discovery|openapi, api/mcp.php). Канонические URL для
#      клиентов без rewrite — /api/ai.php?action=openapi и /api/mcp.php.
#   2. scenarios/ и data/ полностью закрыты от внешнего HTTP: PHP читает файлы
#      с диска напрямую и HTTP-доступа к содержимому каталогов не требует.
#      Публичный доступ к scenarios/*.json обходил бы ACL вкладок гостя —
#      именно это исправлено.
#   3. Прямые .json/.md/.sqlite/.db/.conf и т.п. недоступны извне; сценарии,
#      манифесты и OpenAPI отдаются только через PHP с контролем доступа.
#   4. Security-заголовки, ServerSignature Off, -Indexes.
#
# Проверка после применения:
#   curl -i https://<host>/openapi.json                 -> 200 application/json
#   curl -i https://<host>/.well-known/ai-plugin.json   -> 200 application/json
#   curl -i -X POST -H 'Content-Type: application/json' https://<host>/mcp \
#        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'   -> 200 (часть методов — 401/403)
#   curl -i https://<host>/scenarios/tutorial_data.json -> 403
#   curl -i https://<host>/data/editor-studio.sqlite    -> 403
#   curl -i https://<host>/ai/                          -> 200 text/html

<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html

    # Docker образа php:8.2-apache: a2enmod rewrite headers (Dockerfile).
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # AI-обнаружение: pretty URLs -> канонические PHP-эндпоинты.
        RewriteRule ^/\.well-known/ai-plugin\.json$ /api/ai.php?action=discovery [QSA,L]
        RewriteRule ^/openapi\.json$                 /api/ai.php?action=openapi   [QSA,L]
        RewriteRule ^/llms\.txt$                     /api/ai.php?action=llms_txt  [QSA,L]
        RewriteRule ^/mcp/?$                         /api/mcp.php                 [QSA,L]
        RewriteRule ^/ai/?$                          /ai/index.php               [QSA,L]
    </IfModule>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Наверх никогда не отдаём секреты, конфиги и машиночитаемые файлы.
        # Любой *.json снаружи — только через PHP (ai.php/mcp.php) с ACL.
        <FilesMatch "\.(env|git|gitignore|md|json|sqlite|sqlite3|db|conf|ini|lock|sh|pem|key|crt)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Данные студии (SQLite с гостевыми аккаунтами/токенами, настройки, dumps):
    # снаружи недоступны ничего, кроме PHP-обработчиков (их в этом каталоге нет,
    # поэтому правило — полный запрет с явным ре-аллау .php на будущее).
    <Directory /var/www/html/data>
        Options -Indexes
        AllowOverride None
        Require all denied

        <FilesMatch "\.php$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Сценарии: НИКОГДА не отдаём файлы напрямую. PHP (scenario-files.php)
    # читает и пишет их с диска и сам проверяет имена/baseHash/права гостя.
    <Directory /var/www/html/scenarios>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # maps/ и mapres/ содержат игровые карты:
    #   mapres/ — референсы для рендера тайлов (монтируется ro);
    #   maps/   — игровые .map, студия умеет их загружать (монтируется rw).
    # Они не секретны (участвуют в рендере карт), намеренно не блокируются,
    # но индексы отключены. Если карты не должны быть публичными — закройте
    # и этот каталог; PHP-чтение карт продолжит работать с диска.
    <Directory /var/www/html/mapres>
        Options -Indexes
        AllowOverride None
    </Directory>
    <Directory /var/www/html/maps>
        Options -Indexes
        AllowOverride None
    </Directory>

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    # На HTTPS-вхосте раскомментируйте:
    # Header always set Strict-Transport-Security "max-age=31536000"

    # Disable server signature
    ServerSignature Off

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # PHP settings (can be overridden in php.ini)
    <IfModule mod_php.c>
        php_value upload_max_filesize 50M
        php_value post_max_size 50M
        php_value max_execution_time 300
        php_value memory_limit 256M
    </IfModule>
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
